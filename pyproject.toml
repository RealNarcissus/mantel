[project]
name = "mantel"
version = "0.2.0"
description = "A local-first desktop for coding agents, with a productive day built around it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mantel contributors" }]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: User Interfaces",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["docs", "assets", ".data", ".cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# GTK requires `gi.require_version()` before the GTK imports, so app modules
# import the app after that call by design.
"app/**/*.py" = ["E402"]
# tests bootstrap sys.path before importing the app, and read long strings
"tests/*" = ["E402", "E501"]
# developer probe scripts, kept for reproducing screenshots and fonts
"tests/probe_*.py" = ["E402", "E501", "E702", "E701"]
# one-off reverse-engineering probes: historical research, reviewed by hand
"tools/protocol_probes/*" = ["E402", "E501", "E701", "E702", "F401", "F841"]
