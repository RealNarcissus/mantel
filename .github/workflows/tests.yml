name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: offline suite (no engine)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 and PyGObject
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi python3-gi-cairo python3-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-1 libadwaita-1-0

      - name: Run the tests that need no engine
        run: |
          set -e
          for t in test_schedules test_changes test_context_fallback \
                   test_extras test_signin test_memory test_todos test_focus \
                   test_palette test_engine_adapter; do
            echo "::group::$t"
            python3 "tests/$t.py"
            echo "::endgroup::"
          done

  lint:
    name: syntax and imports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m compileall -q app tests tools
